on:
  push:

name: generate_pkg_list

jobs:
  generate_pkg_list:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} - ${{ matrix.config.bioc }}

    strategy:
      fail-fast: false
      matrix:
        config:
        - {os: macos-13, bioc: 'devel'}
        - {os: windows-latest, bioc: 'devel'}
        - {os: ubuntu-latest, bioc: 'devel'}
        - {os: macos-latest, bioc: 'devel'}
        - {os: ubuntu-24.04-arm, bioc: 'devel'}

    env:
      R_REMOTES_NO_ERRORS_FROM_WARNINGS: true
      _R_CHECK_FORCE_SUGGESTS_: false
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Check out repo
        uses: actions/checkout@v2

      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
            sudo apt-get install libpng-dev

      - name: Set up R and install BiocManager
        uses: grimbough/bioc-actions/setup-bioc@v1
        with:
          bioc-version: ${{ matrix.config.bioc }}

      - name: Build and test environment (Linux arm)
        if: matrix.config.os == 'ubuntu-24.04-arm'
        run: |
          BiocManager::install(c("basilisk", "basilisk.utils"))

          deps <- c(
              "python==3.12",
              # "scipy==1.15.2",
              "requests==2.32.5",
              "Pillow==11.3.0",
              "h5py==3.14.0",
              "pandas==2.3.2",
              "tensorflow==2.19.0",
              "tf-keras==2.19.0",
              # "keras==2.15.0",
              # "pydot==3.0.4",
              "numpy==1.26.4"
          )

          basilisk::setupBasiliskEnv(
            envpath = file.path(".", "orthos-basilisk-env"),
            packages = deps)
          res <- basilisk::basiliskRun(
            env = file.path(".", "orthos-basilisk-env"),
            fun = function() {
                pd <- reticulate::import("pandas")
                pd$`__version__`
            })
          print(res)
          print(basilisk::listPackages(env = file.path(".", "orthos-basilisk-env")))
        shell: Rscript {0}

      - name: Build and test environment (macOS arm)
        if: matrix.config.os == 'macos-latest'
        run: |
          BiocManager::install(c("basilisk", "basilisk.utils"))

          deps <- c(
              "python==3.12",
              # "scipy==1.15.2",
              "requests==2.32.5",
              "Pillow==11.3.0",
              "h5py==3.14.0",
              "pandas==2.3.2",
              "tensorflow==2.19.0",
              "tf-keras==2.19.0",
              # "keras==3.11.3",
              # "pydot==3.0.4",
              "numpy==1.26.4"
          )

          basilisk::setupBasiliskEnv(
            envpath = file.path(".", "orthos-basilisk-env"),
            packages = deps)
          res <- basilisk::basiliskRun(
            env = file.path(".", "orthos-basilisk-env"),
            fun = function() {
                pd <- reticulate::import("pandas")
                pd$`__version__`
            })
          print(res)
          print(basilisk::listPackages(env = file.path(".", "orthos-basilisk-env")))
        shell: Rscript {0}

      - name: Build and test environment (macOS intel)
        if: matrix.config.os == 'macos-13'
        run: |
          BiocManager::install(c("basilisk", "basilisk.utils"))

          deps <- c(
              "python==3.12",
              # "scipy==1.15.2",
              "requests==2.32.5",
              "Pillow==11.3.0",
              "h5py==3.14.0",
              "pandas==2.3.2",
              "tensorflow==2.16.2",
              "tf-keras==2.16.0",
              # "keras==3.11.3",
              # "pydot==3.0.4",
              "numpy==1.26.4"
          )

          basilisk::setupBasiliskEnv(
            envpath = file.path(".", "orthos-basilisk-env"),
            packages = deps)
          res <- basilisk::basiliskRun(
            env = file.path(".", "orthos-basilisk-env"),
            fun = function() {
                pd <- reticulate::import("pandas")
                pd$`__version__`
            })
          print(res)
          print(basilisk::listPackages(env = file.path(".", "orthos-basilisk-env")))
        shell: Rscript {0}

      - name: Build and test environment (Windows)
        if: runner.os == 'Windows'
        run: |
          BiocManager::install(c("basilisk", "basilisk.utils"))

          deps <- c(
              "python==3.12",
              # "scipy==1.7.3",
              "requests==2.32.5",
              "Pillow==11.3.0",
              "h5py==3.14.0",
              "pandas==2.3.2",
              "tensorflow==2.19.0",
              "tf-keras==2.19.0",
              #"keras==2.3.1",
              # "pydot==1.4.2",
              "numpy==1.26.4"
          )

          basilisk::setupBasiliskEnv(
            envpath = file.path(".", "orthos-basilisk-env"),
            packages = deps)
          res <- basilisk::basiliskRun(
            env = file.path(".", "orthos-basilisk-env"),
            fun = function() {
                pd <- reticulate::import("pandas")
                pd$`__version__`
            })
          print(res)
          print(basilisk::listPackages(env = file.path(".", "orthos-basilisk-env")))
        shell: Rscript {0}

      # - name: Setup Miniconda
      #   uses: conda-incubator/setup-miniconda@v3.1.1
      #   with:
      #     miniforge-version: "latest"

      - name: List content of environment
        run: pip3 list ./orthos-basilisk-env

